name: update-data

on:
  schedule:
    # 現況データ: 15分おき（UTC指定。GitHubの都合で数分遅れることがあります）
    - cron: "*/15 * * * *"
    # 日次データ: 毎日 00:20 JST = 15:20 UTC
    - cron: "20 15 * * *"
  workflow_dispatch:
    inputs:
      daily:
        description: "日別降水量も更新する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch data
        env:
          # JR九州ページの簡易判定を使う場合は 1 に。既定は無効（unknown表示）
          BOUSAI_PROBE_TRANSIT: "0"
        run: |
          if [ "${{ github.event.schedule }}" = "20 15 * * *" ] || [ "${{ inputs.daily }}" = "true" ]; then
            python3 scripts/fetch_data.py --daily
          else
            python3 scripts/fetch_data.py
          fi

      - name: Commit
        run: |
          git config user.name  "bousai-bot"
          git config user.email "bousai-bot@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git push
          fi
